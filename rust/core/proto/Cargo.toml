[package]
name = "core-proto"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
compile-algebra = { path = "../../compile/algebra", optional = true }
core-algebra = { path = "../algebra" }
util = { path = "../../util" }
sha2 = "0.10"

[features]
default = ["legacy-lfa1"]
legacy-lfa1 = ["dep:compile-algebra"]

[dev-dependencies]
compile-compiler = { path = "../../compile/compiler" }
circuits-boolean = { path = "../../circuits/boolean" }
compile-logic = { path = "../../compile/logic" }
compile-eval = { path = "../../compile/eval" }
