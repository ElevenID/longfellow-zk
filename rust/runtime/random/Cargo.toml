[package]
name = "runtime-random"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
sha2 = { version = "0.10.8", features = ["compress"] }
aes = { version = "0.8.4", features = ["zeroize"] }
getrandom = { version = "0.3", optional = true }
chacha20 = { version = "0.10.2", default-features = false, features = ["rng", "zeroize"], optional = true }
rand_core = { version = "0.10", optional = true }
zeroize = { version = "1.8", features = ["alloc", "derive"] }
runtime-algebra = { path = "../algebra" }
core-algebra = { path = "../../core/algebra" }

[features]
default = []
secure-random = ["dep:getrandom", "dep:chacha20", "dep:rand_core"]
testonly = ["secure-random"]
hash-test-observer = []
