[package]
name = "runtime-merkle"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
runtime-proto = { path = "../proto" }
runtime-random = { path = "../random", optional = true }
sha2 = "0.10.8"
zeroize = { version = "1.8", features = ["alloc"] }

[features]
default = ["prover"]
prover = ["dep:runtime-random"]

[dev-dependencies]
runtime-random = { path = "../random", features = ["hash-test-observer"] }

[[test]]
name = "merkle"
required-features = ["prover"]
