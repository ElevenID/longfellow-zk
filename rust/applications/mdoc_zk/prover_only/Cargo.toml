edition = "2021"

[lints]
workspace = true

[[bin]]
name = "prover_only"
path = "src/main.rs"

[dependencies]
mdoc-zk-runtime = { path = "../runtime", default-features = false, features = ["prover"] }
runtime-random = { path = "../../../runtime/random", features = ["secure-random"] }
