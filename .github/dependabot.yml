version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "20:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 3
    groups:
      docs-node-dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: "gomod"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "21:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 3
    groups:
      docs-go-dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: "gomod"
    directory: "/reference/verifier-service/server"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "22:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 3
    groups:
      verifier-go-dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "23:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
